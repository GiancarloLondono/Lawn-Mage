name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Processing 4
        run: |
          curl -L "https://github.com/processing/processing4/releases/download/processing-1313-4.5.2/processing-4.5.2-macos-x64-portable.zip" -o processing.zip
          unzip -q processing.zip
          echo "=== Contents ==="
          ls -la

      - name: Export sketch for macOS
        run: |
          PJAVA=$(find . -name "processing-java" 2>/dev/null | head -1)
          echo "Found: $PJAVA"
          chmod +x "$PJAVA"

          "$PJAVA" \
            --force \
            --sketch="$(pwd)/Lawn_Mage_Gameplay" \
            --output="$(pwd)/export_output" \
            --export

          echo "=== Export output ==="
          ls export_output/

      - name: Zip export
        run: |
          cd export_output
          zip -r ../Lawn_Mage_macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lawn_Mage_macOS
          path: Lawn_Mage_macOS.zip
          retention-days: 30
