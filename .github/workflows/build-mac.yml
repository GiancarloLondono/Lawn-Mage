name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Processing 4.5.3
        run: |
          curl -L "https://github.com/processing/processing4/releases/download/processing-1314-4.5.3/processing-4.5.3-macos-x86_64.zip" -o processing.zip
          unzip -q processing.zip
          echo "=== Contents ==="
          ls -la

      - name: Install Processing Sound library
        run: |
          mkdir -p "$HOME/Documents/Processing/libraries"
          # Try official Sound library download
          curl -L "https://github.com/processing/processing-sound/releases/latest/download/sound.zip" \
            -o sound.zip --fail 2>/dev/null || \
          curl -L "https://download.processing.org/contributions/sound.zip" \
            -o sound.zip --fail 2>/dev/null || \
          echo "Sound lib download skipped — may already be bundled"
          
          if [ -f sound.zip ]; then
            unzip -q sound.zip -d "$HOME/Documents/Processing/libraries/"
            echo "Sound library installed"
          fi

      - name: Export sketch for macOS
        run: |
          PJAVA=$(find . -name "processing-java" | head -1)
          echo "processing-java: $PJAVA"
          chmod +x "$PJAVA"
          
          "$PJAVA" \
            --force \
            --sketch="$(pwd)/Lawn_Mage_Gameplay" \
            --output="$(pwd)/export_output" \
            --export
          
          echo "=== Export output ==="
          ls export_output/

      - name: Zip macOS export
        run: |
          cd export_output
          MACOS_DIR=$(ls -d */ | grep -i mac | head -1)
          echo "Zipping: $MACOS_DIR"
          zip -r ../Lawn_Mage_macOS.zip "$MACOS_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lawn_Mage_macOS
          path: Lawn_Mage_macOS.zip
          retention-days: 30
